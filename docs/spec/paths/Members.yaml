get:
  tags:
    - members
  summary: Get members
  description: >
    Returns a paginated list of members with optional filters.
  parameters:
    - in: query
      name: organization_id
      required: false
      schema:
        type: string
        format: uuid
      description: Filter members by organization ID.
    - in: query
      name: account_id
      required: false
      schema:
        type: string
        format: uuid
      description: Filter members by account ID.
    - in: query
      name: text
      required: false
      schema:
        type: string
        minLength: 1
      description: Text filter for members.
    - in: query
      name: include
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - profile
            - organization
      style: form
      explode: false
      description: >
        Optional list of related resources to include in the response.
        Supported values: `profile`, `organization`.
    - in: query
      name: page[limit]
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Max number of items to return (1-100).
    - in: query
      name: page[offset]
      required: false
      schema:
        type: integer
        minimum: 0
      description: Number of items to skip.
  responses:
    '200':
      description: Members successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/MembersCollection.yaml'
    '400':
      description: >
        Bad Request. Filter parameter is not a valid UUID or pagination limit exceeds 100.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'