parameters:
  - in: path
    name: organization_id
    required: true
    schema:
      type: string
      format: uuid
    description: Organization ID

post:
  tags:
    - organizations
  summary: Activate organization
  description: >
    Activates an organization by ID.
    Only the organization head can perform this action.
  security:
    - BearerAuth: [ ]
  responses:
    '200':
      description: Organization successfully activated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Organization.yaml'
    '400':
      description: >
        Bad Request. Provided organization ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '401':
      description: >
        Unauthorized. Missing or invalid authorization token.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '403':
      description: >
        Forbidden. Initiator is not a member of the organization, is not the organization head,
        or the organization is suspended.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '404':
      description: >
        Not Found. Organization does not exist.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'