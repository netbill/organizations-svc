get:
  tags:
    - organizations
  summary: Get organizations
  description: >
    Returns a paginated list of organizations with optional filters.
  parameters:
    - in: query
      name: text
      required: false
      schema:
        type: string
        minLength: 1
      description: Text filter for organizations.
    - in: query
      name: status
      required: false
      schema:
        type: string
        minLength: 1
      description: Filter by organization status.
    - in: query
      name: page[limit]
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Max number of items to return (1-100).
    - in: query
      name: page[offset]
      required: false
      schema:
        type: integer
        minimum: 0
      description: Number of items to skip.
  responses:
    '200':
      description: Organizations successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/OrganizationsCollection.yaml'
    '400':
      description: >
        Bad Request. Pagination limit must be between 1 and 100.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

post:
  tags:
    - organizations
  summary: Create organization
  description: >
    Creates a new organization on behalf of the authenticated account.
  security:
    - BearerAuth: [ ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/CreateOrganization.yaml'
  responses:
    '201':
      description: Organization successfully created
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Organization.yaml'
    '400':
      description: >
        Bad Request. Request body is invalid.
        Check the `errors` array for details.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '401':
      description: >
        Unauthorized. Missing or invalid authorization token.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'