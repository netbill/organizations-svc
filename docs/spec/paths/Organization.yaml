parameters:
  - in: path
    name: organization_id
    required: true
    schema:
      type: string
      format: uuid
    description: Organization ID

get:
  tags:
    - organizations
  summary: Get organization
  description: >
    Returns an organization by ID.
  responses:
    '200':
      description: Organization successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Organization.yaml'
    '400':
      description: >
        Bad Request. Provided organization ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '404':
      description: >
        Not Found. Organization does not exist.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

patch:
  tags:
    - organizations
  summary: Update organization
  description: >
    Updates an organization by ID.
  security:
    - BearerAuth: [ ]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/requests/UpdateOrganization.yaml'
  responses:
    '200':
      description: Organization successfully updated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Organization.yaml'
    '400':
      description: >
        Bad Request. Provided organization ID is not a valid UUID or request body is invalid.
        Check the `errors` array for details.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '401':
      description: >
        Unauthorized. Missing or invalid authorization token.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'

delete:
  tags:
    - organizations
  summary: Delete organization
  description: >
    Deletes an organization by ID.
  security:
    - BearerAuth: [ ]
  responses:
    '204':
      description: Organization successfully deleted
    '400':
      description: >
        Bad Request. Provided organization ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '401':
      description: >
        Unauthorized. Missing or invalid authorization token.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '403':
      description: >
        Forbidden. Organization is suspended, initiator is not a member of the organization,
        does not have enough rights to delete, or organization has an active place.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '404':
      description: >
        Not Found. Organization does not exist.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'