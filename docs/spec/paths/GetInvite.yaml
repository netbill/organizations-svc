parameters:
  - in: path
    name: invite_id
    required: true
    schema:
      type: string
      format: uuid
    description: Invite ID

get:
  tags:
    - invites
  summary: Get invite
  description: >
    Returns an invite by ID for the authenticated account.

    **400 Bad Request** is returned when the invite ID is not a valid UUID.
    **401 Unauthorized** is returned when the authorization token is missing or invalid.
    **404 Not Found** is returned when the invite, profile, or organization does not exist.
    **500 Internal Server Error** is returned when an unexpected error occurs.
  security:
    - BearerAuth: [ ]
  parameters:
    - in: query
      name: include
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - profile
            - organizations
      style: form
      explode: false
      description: >
        Optional list of related resources to include in the response.
        Supported values: `profile`, `organizations`.
  responses:
    '200':
      description: Invite successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Invite.yaml'
    '400':
      description: >
        Bad Request. Provided invite ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '401':
      description: >
        Unauthorized. Missing or invalid authorization token.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '404':
      description: >
        Not Found. Invite, profile, or organization does not exist.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/responses/Errors.yaml'