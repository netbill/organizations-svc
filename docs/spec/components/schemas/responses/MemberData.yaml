type: object
required:
  - id
  - type
  - attributes
  - relationships
properties:
  id:
    type: string
    format: uuid
    description: "member ID"

  type:
    type: string
    enum: [ member ]

  attributes:
    type: object
    required:
      - head
      - created_at
      - updated_at
    properties:
      head:
        type: boolean
        description: "Indicates if the member is the head of the organization"
      position:
        type: string
        description: "The position or role of the member within the organization"
      label:
        type: string
        description: "A label or title associated with the member"
      created_at:
        type: string
        format: date-time
        description: "The date and time when the member was created"
      updated_at:
        type: string
        format: date-time
        description: "The date and time when the member was last updated"

  relationships:
    type: object
    required:
      - organization
      - profile
    properties:
      organization:
        type: object
        required: [ data ]
        properties:
          data:
            type: object
            required: [ type, id ]
            properties:
              type:
                type: string
                enum: [ organization ]
              id:
                type: string
                format: uuid

      profile:
        type: object
        required: [ data ]
        properties:
          data:
            type: object
            required: [ type, id ]
            properties:
              type:
                type: string
                enum: [ profile ]
              id:
                type: string
                format: uuid