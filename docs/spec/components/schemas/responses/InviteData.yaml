type: object
required:
  - id
  - type
  - attributes
  - relationships
properties:
  id:
    type: string
    format: uuid
    description: "Invite ID"

  type:
    type: string
    enum: [ invite ]

  attributes:
    type: object
    required:
      - status
      - updated_at
      - expires_at
      - created_at
    properties:
      status:
        type: string
        enum: [ sent, accepted, declined ]
        description: "The status of the invite"
      updated_at:
        type: string
        format: date-time
        description: "The date and time when the invite was last updated"
      expires_at:
        type: string
        format: date-time
        description: "The expiration date and time of the invite"
      created_at:
        type: string
        format: date-time
        description: "The date and time when the invite was created"

  relationships:
    type: object
    required:
      - organization
      - profile
    properties:
      organization:
        type: object
        required:
          - data
        properties:
          data:
            type: object
            required:
              - type
              - id
            properties:
              type:
                type: string
                enum: [ organization ]
              id:
                type: string
                format: uuid

      profile:
        type: object
        required:
          - data
        properties:
          data:
            type: object
            required:
              - type
              - id
            properties:
              type:
                type: string
                enum: [ profile ]
              id:
                type: string
                format: uuid