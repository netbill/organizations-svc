type: object
required:
  - data
properties:
  data:
    type: object
    required:
      - id
      - type
      - attributes
    properties:
      id:
        type: string
        format: uuid
        description: "organization ID"
      type:
        type: string
        enum: [ organization ]
      attributes:
        type: object
        required:
          - name
          - delete_icon
          - delete_banner
        properties:
          name:
            type: string
            description: "The name of the organization"
          delete_icon:
            type: boolean
            description: "Flag to indicate if the organization's icon should be deleted"
          delete_banner:
            type: boolean
            description: "Flag to indicate if the organization's banner should be deleted"