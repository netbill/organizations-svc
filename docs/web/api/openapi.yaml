openapi: 3.1.1
info:
  description: API documentation for organizations-svc
  title: NetBill organizations-svc API
  version: 0.1.0
servers:
- url: http://localhost:8003
paths:
  /organizations-svc/v1/organizations/:
    get:
      description: |
        Returns a paginated list of organizations with optional filters.
        **400 Bad Request** is returned when pagination limit is out of allowed range. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
      - description: Text filter for organizations.
        explode: true
        in: query
        name: text
        required: false
        schema:
          minLength: 1
          type: string
        style: form
      - description: Filter by organization status.
        explode: true
        in: query
        name: status
        required: false
        schema:
          minLength: 1
          type: string
        style: form
      - description: Max number of items to return (1-100).
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Number of items to skip.
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsCollection"
          description: Organizations successfully retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Pagination limit must be between 1 and 100.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      summary: Get organizations
      tags:
      - organizations
    post:
      description: |
        Creates a new organization on behalf of the authenticated account.
        **400 Bad Request** is returned when the request body is invalid. **401 Unauthorized** is returned when the authorization token is missing or invalid. **500 Internal Server Error** is returned when an unexpected error occurs.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganization"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: Organization successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. Missing or invalid authorization token.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create organization
      tags:
      - organizations
  /organizations-svc/v1/organizations/{organization_id}:
    delete:
      description: |
        Deletes an organization by ID.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the organization is suspended, the initiator is not a member, does not have enough rights, or the organization has an active place. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
      - description: Organization ID
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Organization successfully deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. Missing or invalid authorization token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Forbidden. Organization is suspended, initiator is not a member of the organization, does not have enough rights to delete, or organization has an active place.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Not Found. Organization does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete organization
      tags:
      - organizations
    get:
      description: |
        Returns an organization by ID.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
      - description: Organization ID
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: Organization successfully retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Not Found. Organization does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      summary: Get organization
      tags:
      - organizations
    parameters:
    - description: Organization ID
      explode: false
      in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    put:
      description: |
        Updates an organization by ID.
        **400 Bad Request** is returned when the organization ID is not a valid UUID or request body is invalid. **401 Unauthorized** is returned when the authorization token is missing or invalid. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
      - description: Organization ID
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganization"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: Organization successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Provided organization ID is not a valid UUID or request body is invalid. Check the `errors` array for details.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. Missing or invalid authorization token.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update organization
      tags:
      - organizations
