          description: |
            Not Found. Organization does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get organization invites
      tags:
      - organizations
    parameters:
    - description: Organization ID
      explode: false
      in: path
      name: organization_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  /organizations-svc/v1/organizations/{organization_id}/leave:
    delete:
      description: |
        Removes the authenticated account from the organization. The organization head cannot leave the organization.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member of the organization or is the organization head. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
      - description: Organization ID
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Successfully left the organization
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Unauthorized. Missing or invalid authorization token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Forbidden. Initiator is not a member of the organization or is the organization head.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Not Found. Organization does not exist.
        "500":
          content:
