  /organizations-svc/v1/organizations/{organization_id}/invites:
    get:
      description: |
        Returns a paginated list of invites for the organization. Only members of the organization can access this endpoint.
        **400 Bad Request** is returned when the organization ID is not a valid UUID or pagination limit exceeds 100. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member of the organization. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
      - description: |
          Optional list of related resources to include in the response. Supported values: `profile`, `organization`.
        explode: false
        in: query
        name: include
        required: false
        schema:
          items:
            enum:
            - profile
            - organization
            type: string
          type: array
        style: form
      - description: Max number of items to return (1-100).
        explode: true
        in: query
        name: "page[limit]"
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Number of items to skip.
        explode: true
        in: query
        name: "page[offset]"
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: Organization ID
        explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitesCollection"
          description: Invites successfully retrieved
        "400":
          content:
            application/json:
              schema:
