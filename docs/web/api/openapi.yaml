        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: |
            Not Found. Organization does not exist.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create organization upload media link
      tags:
      - organizations
