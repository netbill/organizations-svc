                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/organizations/{organization_id}/deactivate':
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: Organization ID
    post:
      tags:
        - organizations
      summary: Deactivate organization
      description: |
        Deactivates an organization by ID. Only the organization head can perform this action.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member, not the organization head, or the organization is suspended. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Organization successfully deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not a member of the organization, is not the organization head, or the organization is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/organizations/{organization_id}/suspend':
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: Organization ID
    post:
      tags:
        - organizations
      summary: Suspend organization
      description: |
        Suspends an organization by ID. Requires sysadmin privileges.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator does not have sysadmin privileges. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Organization successfully suspended
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator does not have sysadmin privileges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/organizations/{organization_id}/unsuspend':
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: Organization ID
    post:
      tags:
        - organizations
      summary: Unsuspend organization
      description: |
        Unsuspends an organization by ID. Requires sysadmin privileges.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator does not have sysadmin privileges. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Organization successfully unsuspended
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator does not have sysadmin privileges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /organizations-svc/v1/members/:
    get:
      tags:
        - members
      summary: Get members
      description: |
        Returns a paginated list of members with optional filters.
        **400 Bad Request** is returned when any filter parameter is not a valid UUID or pagination limit exceeds 100. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
        - in: query
          name: organization_id
          required: false
          schema:
            type: string
            format: uuid
          description: Filter members by organization ID.
        - in: query
          name: account_id
          required: false
          schema:
            type: string
            format: uuid
          description: Filter members by account ID.
        - in: query
          name: text
          required: false
          schema:
            type: string
            minLength: 1
          description: Text filter for members.
        - in: query
          name: include
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - profile
                - organization
          style: form
          explode: false
          description: |
            Optional list of related resources to include in the response. Supported values: `profile`, `organization`.
        - in: query
          name: 'page[limit]'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of items to return (1-100).
        - in: query
          name: 'page[offset]'
          required: false
          schema:
            type: integer
            minimum: 0
          description: Number of items to skip.
      responses:
        '200':
          description: Members successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersCollection'
        '400':
          description: |
            Bad Request. Filter parameter is not a valid UUID or pagination limit exceeds 100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/members/{member_id}':
    parameters:
      - in: path
        name: member_id
        required: true
        schema:
          type: string
          format: uuid
        description: Member ID
    get:
      tags:
        - members
      summary: Get member
      description: |
        Returns a member by ID.
        **400 Bad Request** is returned when the member ID is not a valid UUID. **404 Not Found** is returned when the member or any included resource is not found. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - profile
                - organizations
          style: form
          explode: false
          description: |
            Optional list of related resources to include in the response. Supported values: `profile`, `organizations`.
      responses:
        '200':
          description: Member successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: |
            Bad Request. Provided member ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Member, profile, or organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    patch:
      tags:
        - members
      summary: Update member
      description: |
        Updates a member by ID. Only the organization head can perform this action.
        **400 Bad Request** is returned when the member ID is not a valid UUID or request body is invalid. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not the organization head or the organization is suspended. **404 Not Found** is returned when the member or organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMember'
      responses:
        '200':
          description: Member successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: |
            Bad Request. Provided member ID is not a valid UUID or request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not the organization head or the organization is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Member or organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - members
      summary: Delete member
      description: |
        Deletes a member by ID. Only the organization head can delete members. The organization head member cannot be deleted.
        **400 Bad Request** is returned when the member ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator cannot perform this action. **404 Not Found** is returned when the member or organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Member successfully deleted
        '400':
          description: |
            Bad Request. Provided member ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not a member of the organization, is not the organization head, the organization is suspended, or the target member is the organization head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Member or organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  /organizations-svc/v1/invites/:
    post:
      tags:
        - invites
      summary: Create invite
      description: |
        Creates an invite for an account to join an organization. Only the organization head can create invites. The invite expires in 24 hours.
        **400 Bad Request** is returned when the request body is invalid. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member or not the organization head. **404 Not Found** is returned when the organization or account profile does not exist. **409 Conflict** is returned when the account is already a member or an active invite already exists. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvite'
      responses:
        '201':
          description: Invite successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not a member of the organization or is not the organization head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization or account profile does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: |
            Conflict. Account is already a member of the organization or an active invite already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    get:
      tags:
        - invites
      summary: Get invites
      description: |
        Returns a paginated list of invites.
        By default returns invites for the authenticated account. Can be filtered by `account_id` or `organization_id`.
        When filtering by `organization_id`, the initiator must be a member of that organization. When filtering by `account_id`, the initiator must match the requested account.
        **400 Bad Request** is returned when query parameters are invalid or pagination limit exceeds 100. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member of the organization or requests invites for another account. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: account_id
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Filter invites by account ID. Must match the authenticated account.
        - in: query
          name: organization_id
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Filter invites by organization ID. The initiator must be a member of the organization.
        - in: query
          name: include
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - profile
                - organization
          style: form
          explode: false
          description: |
            Optional list of related resources to include in the response. Supported values: `profile`, `organization`.
        - in: query
          name: 'page[limit]'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of items to return (1-100).
        - in: query
          name: 'page[offset]'
          required: false
          schema:
            type: integer
            minimum: 0
          description: Number of items to skip.
      responses:
        '200':
          description: Invites successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitesCollection'
        '400':
          description: |
            Bad Request. Query parameters are invalid or pagination limit exceeds 100. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not a member of the organization or requested invites for another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/invites/{invite_id}':
    parameters:
      - in: path
        name: invite_id
        required: true
        schema:
          type: string
          format: uuid
        description: Invite ID
    get:
      tags:
        - invites
      summary: Get invite
      description: |
        Returns an invite by ID for the authenticated account.
        **400 Bad Request** is returned when the invite ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **404 Not Found** is returned when the invite, profile, or organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: include
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - profile
                - organizations
          style: form
          explode: false
          description: |
            Optional list of related resources to include in the response. Supported values: `profile`, `organizations`.
      responses:
        '200':
          description: Invite successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          description: |
            Bad Request. Provided invite ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Invite, profile, or organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/invites/{invite_id}/accept':
    parameters:
      - in: path
        name: invite_id
        required: true
        schema:
          type: string
          format: uuid
        description: Invite ID
    patch:
      tags:
        - invites
      summary: Accept invite
      description: |
        Accepts an invite for the authenticated account.
        **400 Bad Request** is returned when the invite ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the account has no rights to accept this invite, the invite has expired, or the organization is suspend. **404 Not Found** is returned when the invite or organization does not exist. **409 Conflict** is returned when the invite has already been answered. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invite successfully accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          description: |
            Bad Request. Provided invite ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Account has no rights to accept this invite, invite has expired, or organization is suspend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Invite or organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: |
            Conflict. Invite has already been answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/invites/{invite_id}/decline':
    parameters:
      - in: path
        name: invite_id
        required: true
        schema:
          type: string
          format: uuid
        description: Invite ID
    patch:
      tags:
        - invites
      summary: Decline invite
      description: |
        Declines an invite for the authenticated account.
        **400 Bad Request** is returned when the invite ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the invite is not for this account, the invite has expired. **404 Not Found** is returned when the invite or organization does not exist. **409 Conflict** is returned when the invite has already been answered. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invite successfully declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          description: |
            Bad Request. Provided invite ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Invite is not for this account, invite has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Invite or organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '409':
          description: |
            Conflict. Invite has already been answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/invites/{invite_id}/cancelled':
    parameters:
      - in: path
        name: invite_id
        required: true
        schema:
          type: string
          format: uuid
        description: Invite ID
    patch:
      tags:
        - invites
      summary: Cancel invite
      description: |
        Cancels an invite by ID. Only the organization head can cancel invites.
        **400 Bad Request** is returned when the invite ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member, not the organization head, the invite has already been answered, or the organization is suspended. **404 Not Found** is returned when the invite or organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invite successfully cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          description: |
            Bad Request. Provided invite ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not the organization head, the invite has already been answered, or the organization is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Invite or organization does not exist, or initiator does not have access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrganization:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - organization
            attributes:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the organization
    UpdateOrganization:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
              format: uuid
              description: organization ID
            type:
              type: string
              enum:
                - organization
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the organization
                icon_key:
                  type: string
                  description: The media key for the organization's icon
                banner_key:
                  type: string
                  description: The media key for the organization's banner
    UpdateMember:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
              format: uuid
              description: member ID
            type:
              type: string
              enum:
                - organization_member
            attributes:
              type: object
              properties:
                position:
                  type: string
                  description: The position or role of the member within the organization
                label:
                  type: string
                  description: A label or title associated with the member
    CreateInvite:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum:
                - invite
            attributes:
              type: object
              required:
                - organization_id
                - account_id
              properties:
                organization_id:
                  type: string
                  format: uuid
                  description: The ID of the organization to which the invite belongs
                account_id:
                  type: string
                  format: uuid
                  description: The ID of the account that was invited
    DeleteUploadOrgMedia:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
              format: uuid
              description: organization id
            type:
              type: string
              enum:
                - organization
            attributes:
              type: object
              properties:
                icon_key:
                  type: string
                  description: icon media key
                banner_key:
                  type: string
                  description: banner media key
    PaginationData:
      type: object
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          description: link to the current page
        first:
          type: string
          format: uri
          description: link to the first page
        last:
          type: string
          format: uri
          description: link to the last page
        prev:
          type: string
          format: uri
          description: link to the previous page
        next:
          type: string
          format: uri
          description: link to the next page
    UploadOrgMediaLinks:
      type: object
      required:
        - data
        - included
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
            - relationships
          properties:
            id:
              type: string
              format: uuid
              description: organization id
            type:
              type: string
              enum:
                - organization_upload_links
            attributes:
              type: object
              required:
                - icon
                - banner
              properties:
                icon:
                  $ref: '#/components/schemas/UploadResourcesLink'
                banner:
                  $ref: '#/components/schemas/UploadResourcesLink'
            relationships:
              type: object
              properties:
                organization:
                  type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - id
                        - type
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: organization id
                        type:
                          type: string
                          enum:
                            - organization
        included:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationData'
    UploadResourcesLink:
      type: object
      required:
        - key
        - upload_url
        - preload_url
      properties:
        key:
          type: string
          description: Key for the avatar in the storage service
        upload_url:
          type: string
          format: uri
          description: Pre-signed URL for uploading the avatar
        preload_url:
          type: string
          format: uri
          description: URL for preloading the avatar after upload
    ProfileData:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
          description: account id
        type:
          type: string
          enum:
            - profile
        attributes:
          $ref: '#/components/schemas/ProfileAttributes'
    ProfileAttributes:
      type: object
      required:
        - username
        - version
        - updated_at
        - created_at
      properties:
        username:
          type: string
          description: username for this account and profile
        pseudonym:
          type: string
          description: profile pseudonym
        avatar_url:
          type: string
          description: profile avatar url
        version:
          type: integer
          description: profile version
        updated_at:
          type: string
          format: date-time
          description: updated at
        created_at:
          type: string
          format: date-time
          description: created at
    Organization:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/OrganizationData'
    OrganizationData:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
          description: organization ID
        type:
          type: string
          enum:
            - organization
        attributes:
          type: object
          required:
            - status
            - name
            - version
            - created_at
            - updated_at
          properties:
            status:
              type: string
              description: The status of the organization
            name:
              type: string
              description: The name of the organization
            icon_url:
              type: string
              description: The media url for the organization's icon
            banner_url:
              type: string
              description: The media url for the organization's banner
            version:
              type: integer
              description: 'The version number of the organization, used for optimistic concurrency control'
            created_at:
              type: string
              format: date-time
              description: The date and time when the organization was created
            updated_at:
              type: string
              format: date-time
              description: The date and time when the organization was last updated
    OrganizationsCollection:
      type: object
      required:
        - data
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationData'
        included:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Member/properties/data'
        links:
          $ref: '#/components/schemas/PaginationData'
    Member:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
            - relationships
          properties:
            id:
              type: string
              format: uuid
              description: member ID
            type:
              type: string
              enum:
                - member
            attributes:
              type: object
              required:
                - head
                - created_at
                - updated_at
                - version
              properties:
                head:
                  type: boolean
                  description: Indicates if the member is the head of the organization
                position:
                  type: string
                  description: The position or role of the member within the organization
                label:
                  type: string
                  description: A label or title associated with the member
                version:
                  type: integer
                  description: 'The version number of the member record, used for optimistic locking'
                created_at:
                  type: string
                  format: date-time
                  description: The date and time when the member was created
                updated_at:
                  type: string
                  format: date-time
                  description: The date and time when the member was last updated
            relationships:
              type: object
              required:
                - organization
                - profile
              properties:
                organization:
                  type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          enum:
                            - organization
                        id:
                          type: string
                          format: uuid
                profile:
                  type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          enum:
                            - profile
                        id:
                          type: string
                          format: uuid
        included:
          $ref: '#/components/schemas/MemberIncluded'
    MembersCollection:
      type: object
      required:
        - data
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member/properties/data'
        included:
          $ref: '#/components/schemas/MemberIncluded'
        links:
          $ref: '#/components/schemas/PaginationData'
    MemberIncluded:
      type: array
      items:
        description: 'Included related resources for members (e.g., organization)'
        oneOf:
          - $ref: '#/components/schemas/ProfileData'
          - $ref: '#/components/schemas/OrganizationData'
    Invite:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
            - relationships
          properties:
            id:
              type: string
              format: uuid
              description: Invite ID
            type:
              type: string
              enum:
                - invite
            attributes:
              type: object
              required:
                - status
                - updated_at
                - expires_at
                - created_at
              properties:
                status:
                  type: string
                  enum:
                    - sent
                    - accepted
                    - declined
                  description: The status of the invite
                updated_at:
                  type: string
                  format: date-time
                  description: The date and time when the invite was last updated
                expires_at:
                  type: string
                  format: date-time
                  description: The expiration date and time of the invite
                created_at:
                  type: string
                  format: date-time
                  description: The date and time when the invite was created
            relationships:
              type: object
              required:
                - organization
                - profile
              properties:
                organization:
                  type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          enum:
                            - organization
                        id:
                          type: string
                          format: uuid
                profile:
                  type: object
                  required:
                    - data
                  properties:
                    data:
                      type: object
                      required:
                        - type
                        - id
                      properties:
                        type:
                          type: string
                          enum:
                            - profile
                        id:
                          type: string
                          format: uuid
        included:
          $ref: '#/components/schemas/InviteIncluded'
    InvitesCollection:
      type: object
      required:
        - data
        - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invite/properties/data'
        included:
          $ref: '#/components/schemas/InviteIncluded'
        links:
          $ref: '#/components/schemas/PaginationData'
    InviteIncluded:
      type: array
      items:
        description: 'Included related resources  for invites (e.g., organization, profile)'
        oneOf:
          - $ref: '#/components/schemas/ProfileData'
          - $ref: '#/components/schemas/OrganizationData'
    Errors:
      description: 'Standard JSON:API error'
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          description: Non empty array of errors occurred during request processing
          items:
            type: object
            required:
              - title
              - status
            properties:
              title:
                type: string
                description: 'Title is a short, human-readable summary of the problem'
                example: Bad Request
              detail:
                type: string
                description: Detail is a human-readable explanation specific to this occurrence of the problem
                example: Request body was expected
              status:
                type: integer
                description: Status is the HTTP status code applicable to this problem
                example: 400
                enum:
                  - 400
                  - 401
                  - 403
                  - 404
                  - 409
                  - 500
