openapi: 3.1.1
info:
  title: NetBill organizations-svc API
  description: API documentation for organizations-svc
  version: 0.1.0
servers:
  - url: 'http://localhost:8003'
paths:
  /organizations-svc/v1/organizations/:
    get:
      tags:
        - organizations
      summary: Get organizations
      description: |
        Returns a paginated list of organizations with optional filters.
        **400 Bad Request** is returned when pagination limit is out of allowed range. **500 Internal Server Error** is returned when an unexpected error occurs.
      parameters:
        - in: query
          name: text
          required: false
          schema:
            type: string
            minLength: 1
          description: Text filter for organizations.
        - in: query
          name: status
          required: false
          schema:
            type: string
            minLength: 1
          description: Filter by organization status.
        - in: query
          name: 'page[limit]'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Max number of items to return (1-100).
        - in: query
          name: 'page[offset]'
          required: false
          schema:
            type: integer
            minimum: 0
          description: Number of items to skip.
      responses:
        '200':
          description: Organizations successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationsCollection'
        '400':
          description: |
            Bad Request. Pagination limit must be between 1 and 100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    post:
      tags:
        - organizations
      summary: Create organization
      description: |
        Creates a new organization on behalf of the authenticated account.
        **400 Bad Request** is returned when the request body is invalid. **401 Unauthorized** is returned when the authorization token is missing or invalid. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: Organization successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/organizations/{organization_id}':
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: Organization ID
    get:
      tags:
        - organizations
      summary: Get organization
      description: |
        Returns an organization by ID.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      responses:
        '200':
          description: Organization successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    patch:
      tags:
        - organizations
      summary: Update organization
      description: |
        Updates an organization by ID.
        **400 Bad Request** is returned when the organization ID is not a valid UUID or request body is invalid. **401 Unauthorized** is returned when the authorization token is missing or invalid. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Organization successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID or request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - organizations
      summary: Delete organization
      description: |
        Deletes an organization by ID.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the organization is suspended, the initiator is not a member, does not have enough rights, or the organization has an active place. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Organization successfully deleted
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Organization is suspended, initiator is not a member of the organization, does not have enough rights to delete, or organization has an active place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/organizations/{organization_id}/media':
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: Organization ID
    post:
      tags:
        - organizations
      summary: Create organization upload media link
      description: |
        Creates upload media links for the organization's avatar. Only the organization head can perform this action.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member, not the organization head, or the organization is suspended. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Upload media links successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadOrgMediaLinks'
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not a member of the organization, is not the organization head, or the organization is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    delete:
      tags:
        - organizations
      summary: Delete organization upload media
      description: |
        Deletes an uploaded media for the organization. Only the organization head can perform this action.
        **400 Bad Request** is returned when the request body is invalid. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member, not the organization head, or the organization is suspended. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUploadOrgMedia'
      responses:
        '204':
          description: Icon successfully deleted
        '400':
          description: |
            Bad Request. Request body is invalid. Check the `errors` array for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not a member of the organization, is not the organization head, or the organization is suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: |
            Not Found. Organization does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
  '/organizations-svc/v1/organizations/{organization_id}/activate':
    parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: Organization ID
    post:
      tags:
        - organizations
      summary: Activate organization
      description: |
        Activates an organization by ID. Only the organization head can perform this action.
        **400 Bad Request** is returned when the organization ID is not a valid UUID. **401 Unauthorized** is returned when the authorization token is missing or invalid. **403 Forbidden** is returned when the initiator is not a member, not the organization head, or the organization is suspended. **404 Not Found** is returned when the organization does not exist. **500 Internal Server Error** is returned when an unexpected error occurs.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Organization successfully activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: |
            Bad Request. Provided organization ID is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: |
            Unauthorized. Missing or invalid authorization token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '403':
          description: |
            Forbidden. Initiator is not a member of the organization, is not the organization head, or the organization is suspended.
          content:
